# Controlled vocabulary for the front matter of every automation README.md.
# Automation/tools/build_catalogue.py rejects values that are not listed here.
# Add a value here first, then use it in a README. See METADATA.md.

# eramba section where the automation is attached: where it is created and
# what triggers it. It does not say what the automation is for; that is
# review_family (account review feeds), controls (internal controls) or the name.
eramba_modules:
  Account Review Feeds: Source of an Account Review feed (Security Operations > Account Reviews > Feeds).
  Internal Controls: Runs on the audits of an internal control and records the result.
  Third Parties: Runs from Third Parties, recurrently or from a Third Party notification.
  Online Assessments: Runs from Online Assessments, recurrently or from an Online Assessment notification.
  Security Incidents: Runs from Security Incidents, from an incident notification.
  Any: Not tied to one section (generic function examples).

# Account Review Feeds only: what the feed sends, and the eramba feed type to
# choose for it. Required for Account Review Feeds, not allowed elsewhere.
review_families:
  Account review: List of accounts to be reviewed
  Permission review: List of accounts to be reviewed
  Employee list: List of current employees

# Internal Controls only: recommended audit frequency. Required for them.
audit_frequencies:
  weekly: At least once a week.
  twice-monthly: Twice a month (days 1 and 15).
  monthly: Once a month.
  quarterly: Once a quarter.
  annually: Once a year.

statuses:
  draft: Written and documented, not yet validated on a real eramba and provider.
  tested: Run successfully on a real eramba against the real provider.
  stable: Tested, and in use without open issues.
  deprecated: Kept for reference; do not install.
  example: Function example to copy from, not a complete automation.

domains:
  identity-access: Authentication, MFA and user or privileged account management.
  endpoint-security: Laptops, mobile devices and virtual desktops.
  business-continuity: Backups, restores and recovery objectives.
  capacity-management: Capacity planning and performance monitoring.
  cryptography: Keys, certificates and encryption in transit.
  network-security: Remote access, segmentation and firewalls.
  vulnerability-management: Vulnerability findings and their remediation.
  corrective-actions: Nonconformities and corrective action tracking.
  supplier-management: Supplier inventory, onboarding and reviews.
  incident-response: Escalation and tracking of security incidents.

# Framework names as they appear in the header of
# GRC Templates/LLM - GRC Templates/Controls/mapping_controls_to_requirements.csv.
# READMEs do not list frameworks: build_catalogue.py takes them from that
# mapping through `controls` and writes them to the catalogue. This list fixes
# their order and fails the build if the mapping gains a column nobody listed.
frameworks:
  - PCI DSS v4.0.1
  - ISO 27001:2022
  - ISO 27002:2022
  - SOC 2 (TSP 2017)
  - NIST 800-53 Rev5
  - CIS Controls v8.1
  - SCF 2025
  - NIS2 Article 21
  - ISO 27701:2025
  - ISO 45001:2018
  - ISO 42001:2023
  - ISO 37001:2025
  - ISO 9001:2015
  - OWASP LLM Top 10 2025
  - NIST AI 600-1 2024
  - EU AI Act 2024/1689
  - AESCSF-SP1

